<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spore-Cloud 扫码登录</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f4f5f7; color: #1b1f24; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #16181c; color: #e6e8ea; } }
  .card {
    width: 100%; max-width: 420px; background: #fff; border-radius: 14px; padding: 28px;
    box-shadow: 0 2px 24px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) { .card { background: #1e2126; box-shadow: none; border: 1px solid #2b2f36; } }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .sub { font-size: 12px; opacity: .62; margin: 0 0 20px; word-break: break-all; }
  label { display: block; font-size: 13px; margin: 14px 0 6px; opacity: .8; }
  input {
    width: 100%; padding: 10px 12px; font-size: 14px; border-radius: 8px;
    border: 1px solid #c9ced6; background: #fff; color: inherit;
  }
  @media (prefers-color-scheme: dark) { input { background: #14171b; border-color: #3a3f47; } }
  input:focus { outline: 2px solid #3b82f6; outline-offset: -1px; border-color: transparent; }
  button {
    width: 100%; margin-top: 20px; padding: 11px; font-size: 14px; font-weight: 600;
    border: 0; border-radius: 8px; background: #2f6fed; color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  button.ghost { background: transparent; color: inherit; border: 1px solid #c9ced6; margin-top: 10px; font-weight: 400; }
  .err { margin-top: 14px; font-size: 13px; color: #d92d20; white-space: pre-wrap; }
  .qr-wrap { display: none; }
  .qr-wrap.on { display: block; }
  .qr-box {
    width: 320px; height: 320px; margin: 18px auto 12px; padding: 10px;
    background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  }
  .qr-box img, .qr-box canvas { display: block; }
  .meta { text-align: center; font-size: 13px; opacity: .7; }
  .meta b { font-variant-numeric: tabular-nums; }
  ol.hint { font-size: 12px; opacity: .65; line-height: 1.7; padding-left: 18px; margin: 16px 0 0; }
  .warn { font-size: 12px; color: #b54708; background: #fffaeb; border: 1px solid #fedf89;
          padding: 8px 10px; border-radius: 8px; margin-bottom: 12px; }
  @media (prefers-color-scheme: dark) { .warn { background: #2a2110; border-color: #4d3d16; color: #fdb022; } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <h1>Spore-Cloud 扫码登录</h1>
  <p class="sub" id="sub"></p>

  <div id="warn" class="warn hidden">
    拿不到本机局域网地址（网关的 /qr/info 不可用），二维码里会带 127.0.0.1，手机连不上。
    请改用 <code>http://&lt;本机局域网IP&gt;:19080/qr.html</code> 打开本页。
  </div>

  <form id="login" autocomplete="on">
    <label for="u">账号</label>
    <input id="u" name="username" required autocapitalize="off" autocorrect="off">
    <label for="p">口令</label>
    <input id="p" name="password" type="password" required>
    <button id="go" type="submit">生成二维码</button>
    <div class="err" id="err"></div>
  </form>

  <div class="qr-wrap" id="qrView">
    <div class="qr-box" id="qr"></div>
    <div class="meta"><b id="left">--</b> 秒后自动换票（每张票只能用一次）</div>
    <ol class="hint">
      <li>手机 Spore-Mobile → 设置 →「服务器与同步」→ 扫码登录</li>
      <li>扫完即登录，不需要手填服务器地址</li>
    </ol>
    <button class="ghost" id="out" type="button">换账号</button>
  </div>
</div>

<script src="qrcode.min.js"></script>
<script>
(function () {
  var API = location.origin + '/api';   // 页面自己调接口：同源，不涉及 CORS
  var payloadApi = API;                 // 写进二维码：手机要连的这个地址
  var $ = function (id) { return document.getElementById(id); };
  var token = null, timer = null, deadline = 0, ticker = null;

  $('sub').textContent = '入口 ' + API;

  // 页面可能跑在 127.0.0.1 上，那样编出来的码手机连不上；
  // 向网关要本机局域网地址（默认路由那块网卡），拿不到就沿用当前 origin。
  fetch('/qr/info').then(function (r) { return r.json(); }).then(function (d) {
    if (d && d.lan && !/^127\./.test(d.lan)) {
      payloadApi = 'http://' + d.lan + (location.port ? ':' + location.port : '') + '/api';
      $('sub').textContent = '手机入口 ' + payloadApi;
    } else {
      $('warn').classList.remove('hidden');
    }
  }).catch(function () {
    if (/^(127\.|localhost$)/.test(location.hostname)) $('warn').classList.remove('hidden');
  });
  $('u').value = localStorage.getItem('spore.qr.user') || '';

  function fail(msg) { $('err').textContent = msg || ''; }

  function post(path, body, withToken) {
    var headers = { 'Content-Type': 'application/json' };
    if (withToken) headers.Authorization = 'Bearer ' + token;
    return fetch(API + path, {
      method: 'POST', headers: headers, body: JSON.stringify(body || {})
    }).then(function (r) { return r.json(); }).then(function (env) {
      if (env.code !== 0) throw new Error(env.message || ('错误码 ' + env.code));
      return env.data || {};
    });
  }

  function draw(payload) {
    var box = $('qr');
    box.innerHTML = '';
    new QRCode(box, {
      text: payload, width: 300, height: 300,
      colorDark: '#000000', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  function tick() {
    var left = Math.max(0, Math.round((deadline - Date.now()) / 1000));
    $('left').textContent = left;
  }

  function refresh() {
    post('/auth/qr/ticket', {}, true).then(function (data) {
      var payload = JSON.stringify({ v: 1, api: payloadApi, ticket: data.ticket });
      draw(payload);
      var ttl = data.expiresIn || 60;
      deadline = Date.now() + ttl * 1000;
      tick();
      clearInterval(timer); clearInterval(ticker);
      timer = setInterval(refresh, Math.max(ttl - 5, 5) * 1000);
      ticker = setInterval(tick, 1000);
    }).catch(function (e) {
      clearInterval(timer); clearInterval(ticker);
      fail('换票失败：' + e.message + '（服务还在吗？）');
    });
  }

  $('login').addEventListener('submit', function (ev) {
    ev.preventDefault();
    fail('');
    $('go').disabled = true;
    var user = $('u').value.trim();
    post('/auth/login', { username: user, password: $('p').value }).then(function (data) {
      token = data.token;
      localStorage.setItem('spore.qr.user', user);
      $('login').classList.add('hidden');
      $('qrView').classList.add('on');
      $('p').value = '';
      refresh();
    }).catch(function (e) {
      fail('登录失败：' + e.message);
    }).then(function () { $('go').disabled = false; });
  });

  $('out').addEventListener('click', function () {
    clearInterval(timer); clearInterval(ticker);
    token = null; $('qr').innerHTML = '';
    $('qrView').classList.remove('on');
    $('login').classList.remove('hidden');
    fail('');
  });
})();
</script>
</body>
</html>
