server:
  port: 19082

spring:
  application:
    name: spore-content
  profiles:
    include: local
  datasource:
    url: jdbc:mysql://localhost:3306/spore_cms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: CHANGE_ME
    hikari:
      maximum-pool-size: 8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

spore:
  gateway:
    sign-secret: ${SPORE_SIGN_SECRET:spore-cloud-dev-secret}
  storage:
    # 题库目录（题图）：与 Spore-GUI 同一份目录时，两端看到的是同一批题图
    data-dir: ./data/attachments

management:
  endpoints:
    web:
      exposure:
        include: health,info
