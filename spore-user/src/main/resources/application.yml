server:
  port: 19081

spring:
  application:
    name: spore-user
  profiles:
    include: local            # 真实 DB 口令只在本机 application-local.yml（gitignore）
  datasource:
    url: jdbc:mysql://localhost:3306/spore_cms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: CHANGE_ME
    hikari:
      maximum-pool-size: 8
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  # SSM：自定义 SQL 全在 resources/mapper/*.xml
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    # 本机联调：心跳加快，改完代码重启能被网关立刻发现
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

spore:
  gateway:
    sign-secret: ${SPORE_SIGN_SECRET:spore-cloud-dev-secret}
  jwt:
    expire-hours: 720

management:
  endpoints:
    web:
      exposure:
        include: health,info
